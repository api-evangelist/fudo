aid: fudo
name: Fudo
description: >-
  Fudo is a cloud-based point-of-sale and restaurant management platform used by
  more than 25,000 restaurants, bars, and cafes across Latin America. The product
  covers on-premise and online sales, QR menus, kitchen display, inventory and
  purchasing, expenses, table and room management, staff roles, and delivery-app
  integrations (Uber Eats, Rappi, PedidosYa). Fudo publishes a general-purpose
  public REST API (OpenAPI 3.1, JSON:API style) that lets Pro-plan accounts read
  and write sales, payments, products, customers, expenses, ingredients, and
  system configuration for reporting, BI, ERP, and custom integrations. This
  profile was surfaced as an a16z portfolio company and enriched by the API
  Evangelist pipeline from Fudo's own developer surface.
