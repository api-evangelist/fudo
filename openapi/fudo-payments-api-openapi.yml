                                    type: string
                                    pattern: \d{1,10}
                                    example: '1'
                                  type:
                                    type: string
                                    enum:
                                    - Expense
                                    example: Expense
  /payments/{id}:
    get:
      summary: Get payment
      tags:
      - Payments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: \d{1,10}
          example: '1'
      - name: fields
        in: query
        description: Comma-separated list. See pattern for possible values.
        schema:
          type: object
          additionalProperties: false
          properties:
            payment:
              type: string
              pattern: ^((amount|canceled|createdAt|expectedBy|externalReference|paidAt|paymentMethod|receivedAmount|receivedBy)(,(?!$))?)*$
              example: amount,createdAt
            paymentMethod:
              type: string
              pattern: ^((feePercentage|kind|name|payoutSettings|processor)(,(?!$))?)*$
              example: name,processor
      - name: include
        in: query
        description: Comma-separated list. See pattern for possible values.
        schema:
          type: string
          pattern: ^((paymentMethod)(,(?!$))?)+$
          example: paymentMethod
      responses:
        '200':
          description: A single resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: \d{1,10}
                        example: '1'
                      type:
                        type: string
                        enum:
                        - Payment
                        example: Payment
                      attributes:
                        type: object
