                                    example: Item
                          discountTemplate:
                            type: object
                            additionalProperties: false
                            required:
                            - data
                            properties:
                              data:
                                type: object
                                additionalProperties: false
                                required:
                                - id
                                - type
                                properties:
                                  id:
                                    type: string
                                    pattern: ^\d{1,10}$
                                    example: '1'
                                  type:
                                    type: string
                                    enum:
                                    - DiscountTemplate
                                    example: DiscountTemplate
      responses:
        '201':
          description: The created resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: \d{1,10}
                        example: '1'
                      type:
                        type: string
                        enum:
                        - Discount
                        example: Discount
                      attributes:
                        type: object
                        properties:
                          amount:
                            type: number
                            example: 100.5
                          canceled:
                            type: boolean
                            example: false
                          percentage:
                            type: number
                            example: 15
                          maxAmount:
                            type: number
                            example: 100.5
                      relationships:
                        type: object
                        properties:
                          sale:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: \d{1,10}
                                    example: '1'
                                  type:
                                    type: string
                                    enum:
                                    - Sale
                                    example: Sale
                          item:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: \d{1,10}
                                    example: '1'
                                  type:
                                    type: string
                                    enum:
                                    - Item
                                    example: Item
                          discountTemplate:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    pattern: \d{1,10}
                                    example: '1'
                                  type:
                                    type: string
                                    enum:
                                    - DiscountTemplate
                                    example: DiscountTemplate
      operationId: postDiscounts
      x-operation-id-source: derived
  /discounts/{id}:
    get:
      summary: Get discount
      tags:
      - Discounts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
