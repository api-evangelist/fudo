openapi: 3.2.0
info:
  version: v1alpha1
  title: Fudo Product Modifiers API
  description: '# Overview


    ## Introduction

    This document describes how to make use of the Fudo API.'
servers:
- url: https://api.fu.do/v1alpha1
  description: Production
security:
- bearerAuth: []
tags:
