                              minLength: 1
                              maxLength: 45
                              example: SW500
                            cost:
                              type: number
                              minimum: 0
                              example: 250.5
                            description:
                              type: string
                              maxLength: 255
                              minLength: 1
                              example: Still Water 500cm3
                            enableOnlineMenu:
                              type: boolean
                              example: false
                            enableQrMenu:
                              type: boolean
                              example: false
                            favourite:
                              type: boolean
                              example: false
                            ignoreAvailability:
                              type: boolean
                              example: false
                            imageUrl:
                              type: string
                              example: https://example.com/image.png
                            minStock:
                              type: number
                              minimum: 0
                              example: 50
                            name:
                              type: string
                              minLength: 1
                              maxLength: 45
                              example: Still Water
                            position:
