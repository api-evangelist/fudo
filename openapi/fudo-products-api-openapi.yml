openapi: 3.2.0
info:
  version: v1alpha1
  title: Fudo Products API
  description: '# Overview


    ## Introduction

    This document describes how to make use of the Fudo API.'
servers:
- url: https://api.fu.do/v1alpha1
  description: Production
security:
- bearerAuth: []
tags:
- name: Products
paths:
  /products:
    get:
      summary: Get products
      tags:
      - Products
      parameters:
      - name: filter
        in: query
        description: Object in the form of filter[column]=value.
        schema:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: ^in.\(\d+(,\d+)*\)
              example: in.(1,3,2345)
            name:
              type: string
              pattern: ^ilike\..{1,255}$
              example: ilike.%stew%
            productCategoryId:
              type: string
              pattern: ^eq\.\d{1,255}$
            stock:
              type: string
              pattern: ^isdistinct\.null$
            stockControl:
              type: string
              pattern: ^eq\.true$
            active:
              type: string
              pattern: ^eq\.(true|false)$
              example: eq.true
      - name: page
        in: query
        description: Page number and size.
        schema:
          type: object
          additionalProperties: false
          properties:
            number:
              type: string
              pattern: ^\d+$
            size:
              type: string
              pattern: ^\d+$
      - name: sort
        in: query
        description: Comma-separated list. See pattern for possible values.
        schema:
          type: string
          pattern: ^((-?id|-?name|-?position)(,(?!$))?)+$
          example:
          - id
          - -id
          - name
          - -name
          - position
          - -position
      - name: include
        in: query
        description: Comma-separated list. See pattern for possible values.
        schema:
          type: string
          pattern: ^((invoiceInformation|productModifiersGroups.productModifiers.product|productModifiersGroups.productModifiers|productModifiersGroups|productCategory|productProportions|proportions|unit)(,(?!$))?)+$
          example: productCategory
      - name: fields
        in: query
        description: Object in the form of fields[column]=value.
        schema:
          type: object
          additionalProperties: false
          properties:
            invoiceInformation:
              type: string
              pattern: ^((ncm|)(,(?!$))?)*$
              example: ncm
            product:
              type: string
              pattern: ^((active|code|componentsCost|cost|description|enableOnlineMenu|enableQrMenu|favourite|imageUrl|minStock|name|position|preparationTime|price|productProportions|proportions|sellAlone|stock|stockControl|lastStockCountAt|unit)(,(?!$))?)*$
              example: price,quantity
            productProportion:
              type: string
              pattern: ^((amount|bundledProduct|product)(,(?!$))?)*$
              example: name
            proportion:
              type: string
              pattern: ^((amount|ingredient|product)(,(?!$))?)*$
              example: name
