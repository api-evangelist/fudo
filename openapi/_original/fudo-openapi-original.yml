                                example: Centro
                              street:
                                type: string
                                example: Avenida Paulista
                              number:
                                type: string
                                example: '1000'
                              economicActivity:
                                type: string
                                example: Comercio al por menor
                              countryEntity:
                                type: string
                                example: '11'
                              countrySubentity:
                                type: string
                                example: '11001'
                          firstSaleDate:
                            type: string
                            format: date-time
                            example: '2020-05-11T23:15:00.000Z'
