                        - Customer
                        example: Customer
                      attributes:
                        type: object
                        properties:
                          active:
                            type: boolean
                            example: true
                          address:
                            type: string
                            example: '["Calle falsa", "123", "", "Springfield"]'
                          birthDate:
                            type: string
                            format: date
                            example: '1990-05-15'
                          comment:
                            type: string
                            example: comment
                          createdAt:
                            type: string
                            format: date-time
                            example: '2020-05-11T23:15:00.000Z'
                          discountPercentage:
                            type: number
